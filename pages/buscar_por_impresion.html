

<!DOCTYPE html>
  <html lang='en'>

    <head> 
      <meta charset='utf-8'>
      <meta name='viewport' content='width=device-width, initial-scale=1'>
      <title>Admin Tareas</title> 

      <link rel='stylesheet' href='/pages/css/styles.css'>
      <link rel='stylesheet' href='../dist/css/adminlte.min.css'>
      <link href='https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap' rel='stylesheet'>
      <script src='https://use.fontawesome.com/releases/v6.3.0/js/all.js' crossorigin='anonymous'></script>
    </head>
    
    <body class='hold-transition sidebar-mini layout-fixed layout-footer-fixed'>
      <div class='wrapper'>
        <div id='loaderContainer' class='loader-overlay'>
          <div class='loader'></div>
        </div>
        <div id='sidebar-placeholder'></div> 
        
        <!-- Navbar -->
        <app-navbar
            logout-url=''
            tooltip-text='Cerrar sesión'
            placement='bottom'
            icon-size='fa-2x'
            menu-icon-size='fa-2x'
            clear-keys='tab-activo, ultimaCardActiva'>
        </app-navbar>

        <!-- ====== CONTENIDO ====== -->
        <div class='content-wrapper d-flex flex-column' >
          <section class='content-header'>
            <div class='container-fluid'>
              <div class='row'>
                <div class='col-sm-6'>
                  <h1>Buscar Impresión</h1>
                </div>
              </div>
            </div>
          </section>
          <section class='content flex-fill d-flex'>
            <div class='card ml-3 mr-3 w-100 h-100 d-flex'>
              <div class='card-body content fadeInUp-animation d-flex flex-column justify-content-start'>
                <div class='col-md-8 offset-md-2'>
                  <form >
                    <div class='input-group'>
                      <input type='search' class='form-control form-control-lg' placeholder='Ingresa el número de la impresión'>
                      <div class='input-group-append'>
                        <button type='submit' class='btn btn-lg btn-default'>
                          <i class='fa fa-search'></i>
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
                <!-- separador opcional -->
              <div class='my-3'></div>

              <!-- imagen centrada y a 350px -->
              <div class='row no-gutters flex-grow-1 pb-5'>
                <div class='col-12 d-flex justify-content-center align-items-center'>
                  <img src='/assets/search.png' alt='Search...' class='img-350 d-block'>
                </div>
              </div>
              </div> 
            </div>
          </section> 
        </div> 
        
        <footer class='main-footer'>
          <strong>Cartonajes Bernabeú.</strong>
        </footer>
        <aside class='control-sidebar control-sidebar-dark'></aside>

      </div>                                                                          
    
      <script src='../plugins/jquery/jquery.min.js'></script> 
      <script src='../plugins/bootstrap/js/bootstrap.bundle.min.js'></script> 
      <script src='../dist/js/adminlte.min.js'></script>  
      <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11'></script>
      <script src='/pages/js/scripts.js'></script>

      <script>
        fetch('sidebar.html').then(response => response.text()).then(html => {
          document.getElementById('sidebar-placeholder').innerHTML = html;

          // Después de insertar el HTML, activa el enlace correcto
          const currentPath = window.location.pathname; 
          const links = document.querySelectorAll('#sidebar-placeholder .nav-link');

          links.forEach(link => {
            link.getAttribute('href') === currentPath 
              ? link.classList.add('active') 
              : link.classList.remove('active'); 
          });
        });
      </script> 
    </body>
  </html>
