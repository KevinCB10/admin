<!DOCTYPE html>
    <html lang='en'>

        <head>
            <meta charset='utf-8'>
            <meta name='viewport' content='width=device-width, initial-scale=1'>
            <title>Admin Tareas</title> 
            <link rel='stylesheet' href='/pages/css/styles.css'>
            <link rel='stylesheet' href='../dist/css/adminlte.min.css'>
            <link href='https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap' rel='stylesheet'>
            <script src='https://use.fontawesome.com/releases/v6.3.0/js/all.js' crossorigin='anonymous'></script>
        </head>

        <body class='hold-transition sidebar-mini layout-fixed layout-footer-fixed'>
            <div class='wrapper'> 
                <div id='loaderContainer' class='loader-overlay'>
                    <div class='loader'></div>
                </div>

                <div id='sidebar-placeholder'></div> 
                <!-- Navbar -->
                <app-navbar
                    logout-url=''
                    tooltip-text='Cerrar sesión'
                    placement='bottom'
                    icon-size='fa-2x'
                    menu-icon-size='fa-2x'
                    clear-keys='tab-activo, ultimaCardActiva'>
                </app-navbar>

                <!-- ====== CONTENIDO ====== -->
                <div class='content-wrapper'> 
                    <section class='content-header'>
                        <div class='container-fluid'>
                            <div class='row'>
                                <div class='col-sm-6'>
                                    <h1>Listado de Clientes</h1>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section>
                        <div class='card ml-3 mr-3'>
                            <div class='card-body content fadeInUp-animation'>
                                <div class='d-flex align-items-center mb-3'>
                                    <div class='input-group input-group-lg' style='max-width:380px;'>
                                        <input
                                            id='buscar-clientes'
                                            type='search'
                                            class='form-control'
                                            placeholder='Buscar cliente...'
                                            autocomplete='off'
                                        >
                                        <div class='input-group-append'>
                                            <button class='btn btn-outline-secondary' id='limpiar-buscar-clientes' type='button' title='Limpiar'><i class='fa-solid fa-eraser'></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class='row'>
                                    <div class='col-12'>
                                        <div class='table-responsive'>
                                            <table class='table table-hover align-middle'>
                                                <thead class='thead-light'>
                                                    <tr>
                                                        <th class='info-destacada'>Cliente</th>
                                                        <th class='info-destacada'>Código</th> 
                                                        <th class='info-destacada'>Acciones</th>
                                                    </tr>
                                                </thead>
                                                <tbody id='tabla-clientes'> </tbody> 
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section> 
                </div>

                <!-- Footer -->
                <footer class='main-footer'>
                    <strong>Cartonajes Bernabeú.</strong>
                </footer> 
                <aside class='control-sidebar control-sidebar-dark'></aside> 
            </div>

            <!-- Scripts -->
            <script src='../plugins/jquery/jquery.min.js'></script>
            <script src='../plugins/bootstrap/js/bootstrap.bundle.min.js'></script>
            <script src='../plugins/datatables/jquery.dataTables.min.js'></script>
            <script src='../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js'></script>
            <script src='../plugins/datatables-responsive/js/dataTables.responsive.min.js'></script>
            <script src='../plugins/datatables-buttons/js/dataTables.buttons.min.js'></script>
            <script src='../plugins/datatables-buttons/js/buttons.bootstrap4.min.js'></script>
            <script src='../plugins/jszip/jszip.min.js'></script>
            <script src='../plugins/pdfmake/pdfmake.min.js'></script>
            <script src='../plugins/pdfmake/vfs_fonts.js'></script>
            <script src='../plugins/datatables-buttons/js/buttons.html5.min.js'></script>
            <script src='../plugins/datatables-buttons/js/buttons.print.min.js'></script>
            <script src='../plugins/datatables-buttons/js/buttons.colVis.min.js'></script>
            <script src='../dist/js/adminlte.min.js'></script> 
            <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11'></script>
            <script src='/pages/js/scripts.js'></script>
             
            <script>
                fetch('sidebar.html').then(r => r.text()).then(html => {
                    const contenedor = document.getElementById('sidebar-placeholder');
                    contenedor.innerHTML = html;

                    // 1) Limpiar cualquier "active"
                    const enlaces = contenedor.querySelectorAll('.nav-link');
                    enlaces.forEach(enlace => enlace.classList.remove('active'));

                    // 2) Calcular a qué item hay que activar según la URL actual
                    const ruta = window.location.pathname.toLowerCase();
                    const archivo = ruta.split('/').pop();

                    // Mapa de páginas que comparten el mismo ítem del menú
                    let hrefObjetivo = ruta; // por defecto, la misma ruta
                    switch (archivo) {
                        case 'cliente.html':
                        case 'detalle_cliente.html':
                        hrefObjetivo = '/pages/listado_clientes.html';
                        break; 
                    }

                    // 3) Activar el enlace cuyo href coincida (igual o por sufijo)
                    let activado = false;
                    enlaces.forEach(enlace => {
                        const h = (enlace.getAttribute('href') || '').toLowerCase();
                        if (h === hrefObjetivo || h.endsWith(hrefObjetivo)) {
                        enlace.classList.add('active');
                        activado = true;
                        }
                    });

                    // 4) Fallback: si no encontró, intenta por nombre de archivo exacto
                    if (!activado) {
                        enlaces.forEach(enlace => {
                            const h = (enlace.getAttribute('href') || '').toLowerCase();
                            if (h.endsWith('/' + archivo)) enlace.classList.add('active');
                        });
                    }
                });
            </script>
        </body> 
    </html>
