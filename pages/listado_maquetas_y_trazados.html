    <!-- Pre-carga del sidebar (SIN skeleton) -->
    <script>
      window.__sidebarCacheKey = 'SIDEBAR_HTML_v1';
      window.__sidebarHTML = sessionStorage.getItem(window.__sidebarCacheKey) || null;
      window.__sidebarFetch = window.__sidebarHTML
        ? Promise.resolve(window.__sidebarHTML)
        : fetch('sidebar.html').then(r => r.text()).then(html => {
            try { sessionStorage.setItem(window.__sidebarCacheKey, html); } catch(e){}
            return html;
          });
    </script>
  
    <script src='https://use.fontawesome.com/releases/v6.3.0/js/all.js' crossorigin='anonymous'></script>
  </head>

      <aside class='control-sidebar control-sidebar-dark'></aside> 
    </div>                 

    <!-- Hidratar el sidebar ANTES de scripts pesados (sin skeleton) -->
    <script>
      (async () => {
        const target = document.getElementById('sidebar-placeholder');
        if (!target) return;

        try {
          const html = window.__sidebarHTML || await window.__sidebarFetch;
          target.innerHTML = html;

          // ==== marcar activo de forma robusta ====
          const norm = p => p.replace(/\/+$/,'');
          const current = norm(location.pathname);
          const currentFile = (current.split('/').pop() || 'index.html').toLowerCase();

          const links = target.querySelectorAll('.nav-link[href]');
          let matched = null;

          links.forEach(link => {
            link.classList.remove('active');
            const raw = link.getAttribute('href') || '';
            if (!raw || raw === '#') return;

            const url = new URL(raw, location.origin);
            const linkPath = norm(url.pathname);
            const linkFile = (linkPath.split('/').pop() || 'index.html').toLowerCase();

            const isExact    = linkPath === current;
            const isSameFile = linkFile === currentFile;
            const isSuffix   = current.endsWith(linkPath) || linkPath.endsWith(current);

            if (isExact || isSameFile || isSuffix) matched = link;
          });

          if (matched) {
            matched.classList.add('active');
            let li = matched.closest('.nav-item');
            while (li) {
              if (li.classList.contains('has-treeview')) {
                li.classList.add('menu-open');
                const parentLink = li.querySelector(':scope > .nav-link');
                if (parentLink) parentLink.classList.add('active');
              }
              li = li.parentElement?.closest('.nav-item');
            }
          }
          // ==== fin activo robusto ====
        } catch (e) {
          console.error('No se pudo hidratar el sidebar:', e);
        }
      })();
    </script>

    <!-- JS -->
    <script src='../plugins/jquery/jquery.min.js'></script>

    <script>
      // Ejecutar todo
      renderTabla();
      $(document).ready(() => initDataTable());

         fetch('sidebar.html').then(response => response.text()).then(html => {
        document.getElementById('sidebar-placeholder').innerHTML = html;
        
        // Después de insertar el HTML, activa el enlace correcto
        const currentPath = window.location.pathname; 
        const links = document.querySelectorAll('#sidebar-placeholder .nav-link');
        
        links.forEach(link => { 
          link.getAttribute('href') === currentPath 
            ? link.classList.add('active') 
            : link.classList.remove('active'); 
        });
      });
    </script>
